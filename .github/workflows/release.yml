name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g. v1.0.0 or v1.0.0-alpha.1)'
        required: true
        type: string

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.tag || github.ref }}

      - name: Install Lua 5.1
        run: |
          sudo apt-get update
          sudo apt-get install -y lua5.1

      - name: Validate addon
        run: |
          lua5.1 tests/brood-window.lua
          luac5.1 -p Core.lua BroodWindow.lua EditMode.lua Interrupts.lua tests/brood-window.lua

      - name: Package and publish GitHub release
        uses: BigWigsMods/packager@v2
        with:
          args: -u
          # CurseForge: set the CURSEFORGE_PROJECT_ID repository variable,
          # then replace the args line above with this one:
          # args: -u -p ${{ vars.CURSEFORGE_PROJECT_ID }}
        env:
          GITHUB_OAUTH: ${{ secrets.GITHUB_TOKEN }}
          # CurseForge: add the CF_API_KEY repository secret, then uncomment:
          # CF_API_KEY: ${{ secrets.CF_API_KEY }}
